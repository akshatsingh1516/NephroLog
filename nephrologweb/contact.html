<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Contact - NephroLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f7;--card:#ffffff;--text:#1d1d1f;--muted:#6e6e73;--green:#16a34a;--border:rgba(0,0,0,0.08)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
.wrap{max-width:900px;margin:0 auto;padding:48px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.logo img{height:72px}
.home{display:inline-block;padding:10px 16px;border-radius:999px;background:var(--green);color:#fff;text-decoration:none;font-weight:500}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px}
h1{font-family:'DM Serif Display',serif;font-size:42px;line-height:1.05;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:20px}
.form{display:grid;gap:12px;margin-top:16px}
label{font-weight:500}
input,textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font:inherit}
textarea{min-height:120px;resize:vertical}
button{padding:12px 16px;border:none;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.helper{color:var(--muted);font-size:14px;margin-top:8px}
.footer-links{margin-top:28px;display:flex;gap:14px;flex-wrap:wrap}
.footer-links a{color:var(--green);text-decoration:none;font-weight:500}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="index.html"><img src="logo.png" alt="NephroLog"/></a>
      <a class="home" href="index.html">Back to Home</a>
    </div>
    <div class="card">
      <h1>Contact</h1>
      <p class="sub">Send us your question and we will get back to you.</p>
      <form class="form" action="mailto:syntaxsorcerers12@gmail.com" method="post" enctype="text/plain">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required/>
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required/>
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
      <p class="helper">If your email app does not open, write directly to syntaxsorcerers12@gmail.com.</p>
      <div class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
        <a href="support.html">Support</a>
      </div>
    </div>
  </div>
</body>
</html>
